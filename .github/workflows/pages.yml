name: Deploy PRDXQ to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject shared navigation and theme assets into pages
        env:
          PRDXQ_ASSET_VERSION: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          for page in Path('.').glob('*.html'):
              text = page.read_text(encoding='utf-8')
              css = '<link rel="stylesheet" href="theme.css">'
              if 'href="theme.css' not in text:
                  text = text.replace('</head>', css + '</head>')
              for filename in ('admin-link.js', 'theme-switch.js'):
                  if f'src="{filename}' not in text:
                      text = text.replace('</body>', f'<script src="{filename}"></script>' + '</body>')
              version = os.environ.get('PRDXQ_ASSET_VERSION', '1')
              # Replace cached asset URLs on every deploy so mobile browsers do not keep stale JS/CSS.
              text = re.sub(r'href="theme\.css(?:\?[^"]*)?"', 'href="theme.css?v=' + version + '"', text)
              text = re.sub(r'src="script\.js(?:\?[^"]*)?"', 'src="script.js?v=' + version + '"', text)
              page.write_text(text, encoding='utf-8')
          PY
      - name: Validate JavaScript syntax
        run: node --check script.js && node --check admin-link.js && node --check theme-switch.js && node --check work-showcase.js && node --check reward.js
      - name: Validate required shared UI and service count
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pages = ["index.html", "work.html", "lab.html", "design.html", "about.html", "contact.html", "impressum.html", "datenschutz.html"]
          for page in pages:
              text = Path(page).read_text(encoding="utf-8")
              assert ('script.js' in text) or page == "admin.html", f"{page}: shared script missing"
              assert 'styles.css' in text, f"{page}: stylesheet missing"
          script = Path("script.js").read_text(encoding="utf-8")
          assert "prdxq-contact-widget" in script, "shared contact card missing"
          assert "const keys=['build','apps','systems','design','media','it','shopify']" in script, "mobile explorer must expose seven services"
          assert "count.textContent=String(active+1).padStart(2,'0')+' / 07'" in script, "mobile service count must be seven"
          index = Path("index.html").read_text(encoding="utf-8")
          assert index.count("<details>") == 6, "homepage FAQ should contain six expandable questions"
          work = Path("work.html").read_text(encoding="utf-8")
          assert 'id="shopify"' in work, "Shopify service detail missing"
          contact = Path("contact.html").read_text(encoding="utf-8")
          assert 'id="leadEmail"' in contact and 'id="leadName"' in contact, "customer form fields missing"
          assert "submit-prdxq-inquiry" in contact, "Supabase submission endpoint missing"
          admin = Path("admin.html").read_text(encoding="utf-8")
          assert 'id="loginForm"' in admin and 'is_prdxq_admin' in admin, "admin login/access check missing"
          assert 'styles.css' in admin, "admin stylesheet missing"
          assert Path("admin-link.js").exists(), "admin navigation link script missing"
          print("Static site checks passed.")
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
